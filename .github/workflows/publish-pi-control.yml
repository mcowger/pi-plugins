name: Publish pi-control

on:
  push:
    tags:
      - "pi-control-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package.json
        working-directory: packages/pi-control
        run: |
          tag="${GITHUB_REF_NAME#pi-control-v}"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match packages/pi-control/package.json (${pkg}); bump the version, commit, then re-tag"
            exit 1
          fi
          echo "tag and package.json agree on ${pkg}"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check:pi-control

      - name: Run tests
        working-directory: packages/pi-control
        run: bun test

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish @mcowger/pi-control
        working-directory: packages/pi-control
        run: npm publish --access public --provenance
