name: Publish pi-suppress-providers

on:
  push:
    tags:
      - "pi-suppress-providers-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check:pi-suppress-providers

      - name: Run tests
        working-directory: packages/pi-suppress-providers
        run: bun test

      - name: Sync version from tag
        working-directory: packages/pi-suppress-providers
        run: npm pkg set version="${GITHUB_REF_NAME#pi-suppress-providers-v}"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish @mcowger/pi-suppress-providers
        working-directory: packages/pi-suppress-providers
        run: npm publish --access public --provenance
